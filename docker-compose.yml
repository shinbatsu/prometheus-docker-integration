version: '3.9'

volumes:
  gopkg:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: prometheus-docker-integration:latest
    container_name: prometheus-docker-integration
    working_dir: /usr/src/prometheus-docker-integration
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/host/sys:ro
      - gopkg:/go/pkg
    privileged: true
    pid: host
    ports:
      - "9476:9476"
    restart: unless-stopped
